name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  BASE_URL: http://localhost:8080
  UI_URL: http://localhost:8080
  USER_USERNAME: tester
  USER_PASSWORD: senha1234
  USER_EMAIL: qa@teste.com
  DEFAULT_CURRENCY: BRL
  DEFAULT_LANGUAGE: pt_BR

jobs:
  api:
    name: API Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Start ezBookKeeping
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d
          echo "Aguardando aplicação..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080 > /dev/null 2>&1; then
              echo "Aplicação pronta!"
              exit 0
            fi
            sleep 2
          done
          echo "Aplicação não respondeu a tempo"
          docker compose -f docker-compose.yml -f docker-compose.ci.yml logs --tail 40
          exit 1

      - name: Seed test user
        run: |
          curl -sf -X POST http://localhost:8080/api/register.json \
            -H 'Content-Type: application/json' \
            -d '{
              "username":"tester",
              "password":"senha1234",
              "email":"qa@teste.com",
              "nickname":"Tester",
              "language":"pt_BR",
              "defaultCurrency":"BRL",
              "firstDayOfWeek":1,
              "categories":[{"name":"Transporte","type":2,"icon":"201","iconType":0,"color":"FF0000","comment":"","subCategories":[]}]
            }' > /dev/null && echo "usuário criado" || echo "usuário já existia (ok)"

      - name: Run API tests
        run: mvn clean test -Papi --batch-mode

      - name: Upload Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-api
          path: target/surefire-reports/
          retention-days: 14

  ui:
    name: UI Tests
    runs-on: ubuntu-latest
    needs: api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run UI tests
        run: mvn clean test -Pui --batch-mode

      - name: Upload Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-ui
          path: target/surefire-reports/
          retention-days: 14

  shutdown:
    name: Shutdown
    runs-on: ubuntu-latest
    needs: [api, ui]
    if: always()
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    steps:
      - name: Shutdown
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml down -v